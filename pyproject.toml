[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pawweaver"
version = "0.1.0"
description = "Goal-driven whole-body control for AS2 EDU and Piper-H; Isaac Lab to independent MuJoCo"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
control = ["torch>=2.10,<2.12", "mujoco==3.8.0", "trimesh>=4.11,<5", "pycollada>=0.9,<1"]
test = ["pytest>=8,<10"]
data = ["h5py>=3.16", "scipy>=1.15"]
cad = ["cadquery-ocp==8.0.1.0.0"]
vision = ["opencv-python-headless>=4.10,<5"]
render = ["pillow>=12", "imageio>=2.36", "imageio-ffmpeg>=0.6"]
train = ["rsl-rl-lib==5.0.1", "gymnasium>=1.2,<2", "tensorboard>=2.18"]

[project.scripts]
pawweaver = "pawweaver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
